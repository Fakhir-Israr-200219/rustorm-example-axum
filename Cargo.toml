[package]
name = "rustorm-example-axum"
version = "0.1.0"
edition = "2021"

[dependencies]
rustorm = { path = "../Rust-ORM/rustorm" }
axum = { version = "0.7", features = ["json", "macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }
